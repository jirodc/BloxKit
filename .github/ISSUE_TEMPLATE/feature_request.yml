name: Feature request
description: An idea to make BloxKit better.
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why? What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today, if at all?
